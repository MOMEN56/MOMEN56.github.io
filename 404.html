<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>مكانك | فتح التطبيق</title>
    <meta name="description" content="افتح المتجر أو المنتج داخل تطبيق مكانك" />
    <style>
      :root {
        color-scheme: light;
        --primary: #004aad;
        --bg: #f4f7fb;
        --text: #102033;
        --muted: #5f6f82;
        --card: #ffffff;
        --border: #dce6f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #e8f1ff, var(--bg));
        color: var(--text);
      }

      main {
        width: min(100%, 460px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgb(16 32 51 / 12%);
      }

      .logo {
        width: 74px;
        height: 74px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        background: var(--primary);
        color: white;
        font-size: 34px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.4;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.7;
      }

      .actions {
        display: grid;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        width: 100%;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        padding: 0 16px;
        text-decoration: none;
        font-weight: 700;
      }

      .button.primary {
        background: var(--primary);
        color: white;
      }

      .button.secondary {
        background: #eef3fb;
        color: var(--primary);
      }

      .hint {
        margin-top: 16px;
        margin-bottom: 0;
        font-size: 13px;
      }

      code {
        direction: ltr;
        display: inline-block;
        max-width: 100%;
        overflow-wrap: anywhere;
        background: #eef3fb;
        border-radius: 8px;
        padding: 4px 8px;
        color: #23364d;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">م</div>
      <h1 id="title">فتح تطبيق مكانك</h1>
      <p id="message">جاري تجهيز الرابط...</p>
      <p id="identifier" hidden><code id="identifierValue"></code></p>
      <div id="actions" class="actions">
        <a id="openLink" class="button primary" href="#">افتح في التطبيق</a>
        <a id="playLink" class="button secondary" href="#">تحميل التطبيق من Google Play</a>
      </div>
      <p class="hint" id="hint"></p>
    </main>

    <script>
      (function () {
        const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.makanak.app';
        const FALLBACK_DELAY_MS = 1800;

        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const identifier = document.getElementById('identifier');
        const identifierValue = document.getElementById('identifierValue');
        const actions = document.getElementById('actions');
        const openLink = document.getElementById('openLink');
        const playLink = document.getElementById('playLink');
        const hint = document.getElementById('hint');

        const linkData = readLinkData(window.location);

        if (!linkData.shopId) {
          showInvalidLink();
          return;
        }

        const isProductLink = Boolean(linkData.productId);
        const appUrl = buildAppUrl(linkData.shopId, linkData.productId);
        const playUrl = buildPlayUrl(linkData.shopId, linkData.productId);
        const pageTitle = isProductLink
          ? 'فتح المنتج داخل تطبيق مكانك'
          : 'فتح المتجر داخل تطبيق مكانك';

        document.title = 'مكانك | ' + pageTitle;
        title.textContent = pageTitle;
        message.textContent = isProductLink
          ? 'سيتم فتح المنتج داخل تطبيق مكانك.'
          : 'سيتم فتح المتجر داخل تطبيق مكانك.';
        identifier.hidden = false;
        identifierValue.textContent = isProductLink ? linkData.productId : linkData.shopId;
        openLink.href = appUrl;
        playLink.href = playUrl;
        hint.textContent = 'إذا لم يفتح التطبيق تلقائيا، يمكنك استخدام الأزرار أعلاه.';

        let fallbackTimer = 0;
        let pageWasHidden = false;

        function clearFallbackTimer() {
          if (fallbackTimer) {
            window.clearTimeout(fallbackTimer);
            fallbackTimer = 0;
          }
        }

        function markPageHidden() {
          pageWasHidden = true;
          clearFallbackTimer();
        }

        function openApp() {
          pageWasHidden = false;
          clearFallbackTimer();

          try {
            window.location.href = appUrl;
          } catch (error) {
            // Some browsers throw for unknown schemes; the fallback still handles that case.
          }

          fallbackTimer = window.setTimeout(function () {
            if (!pageWasHidden && document.visibilityState !== 'hidden') {
              window.location.href = playUrl;
            }
          }, FALLBACK_DELAY_MS);
        }

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') {
            markPageHidden();
          }
        });

        window.addEventListener('pagehide', markPageHidden);

        openLink.addEventListener('click', function (event) {
          event.preventDefault();
          openApp();
        });

        openApp();

        function showInvalidLink() {
          document.title = 'مكانك | الرابط غير صحيح';
          title.textContent = 'الرابط غير صحيح';
          message.textContent = 'تأكد من رابط المتجر أو المنتج ثم حاول مرة أخرى.';
          identifier.hidden = true;
          actions.hidden = true;
          hint.textContent = '';
        }

        function readLinkData(location) {
          const params = new URLSearchParams(location.search);
          const queryShopId = cleanValue(params.get('shopId'));
          const queryProductId = cleanValue(params.get('productId'));
          const segments = location.pathname
            .split('/')
            .filter(Boolean)
            .map(cleanValue);

          const shopsIndex = segments.indexOf('shops');
          const pathShopId = shopsIndex === -1 ? '' : cleanValue(segments[shopsIndex + 1]);
          const pathProductId =
            shopsIndex !== -1 && segments[shopsIndex + 2] === 'products'
              ? cleanValue(segments[shopsIndex + 3])
              : '';

          return {
            shopId: pathShopId || queryShopId,
            productId: pathProductId || queryProductId,
          };
        }

        function buildAppUrl(shopId, productId) {
          const shopPath = 'makanak://shops/' + encodeURIComponent(shopId);

          if (!productId) {
            return shopPath;
          }

          return shopPath + '/products/' + encodeURIComponent(productId);
        }

        function buildPlayUrl(shopId, productId) {
          const referrer = new URLSearchParams();
          referrer.set('shopId', shopId);

          if (productId) {
            referrer.set('productId', productId);
          }

          return PLAY_STORE_URL + '&referrer=' + encodeURIComponent(referrer.toString());
        }

        function cleanValue(value) {
          if (!value) {
            return '';
          }

          try {
            return decodeURIComponent(value).trim();
          } catch (error) {
            return String(value).trim();
          }
        }
      })();
    </script>
  </body>
</html>
